worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Log settings (optional but recommended)
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    upstream cyclobots_api {
        least_conn;  # Load balancing algorithm (least number of connections)
        
        server app1:8080 max_fails=3 fail_timeout=30s;
        server app2:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 9999;
        server_name _;

        location / {
            proxy_pass http://cyclobots_api;
            proxy_http_version 1.1;

            # Forward headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket support (optional for future)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health check endpoint (optional)
        location /healthz {
            return 200 "NGINX is up and running\n";
            add_header Content-Type text/plain;
        }
    }
}
